
name: Build Professional Sales App APK

on:
  push:
    paths:
      - 'SalesManagementApp_Professional_V1.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract new project
        run: |
          test -f SalesManagementApp_Professional_V1.zip
          unzip -q SalesManagementApp_Professional_V1.zip -d source

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Sales-App
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
